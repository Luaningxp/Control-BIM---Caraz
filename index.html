<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Control BIM · Hospital Caraz II-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-hidden">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-logo-box mb-5">
                <img src="assets/suyay.png" alt="SUYAY">
                <div class="w-px h-10 bg-slate-200"></div>
                <img src="assets/anin.png" alt="ANIN">
            </div>
            <div class="text-center mb-5">
                <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-sky-600">Consorcio SUYAY II</p>
                <h2 class="font-bold text-xl text-slate-900 mt-1 leading-tight">Control del Equipo BIM</h2>
                <p class="text-[11px] text-slate-500 mt-1">Paquete 8 · Caraz · Hospital II-1</p>
            </div>
            <div class="h-px bg-gradient-to-r from-transparent via-slate-300 to-transparent my-4"></div>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" placeholder="usuario@consorciosuyay.com">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-md shadow-sky-600/20">
                    <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Ingresar al CDE
                </button>
            </form>
            <div id="login-error" class="text-xs text-red-600 text-center hidden font-medium mt-3"></div>
        </div>
    </div>

    <!-- APP -->
    <div id="app-screen" class="hidden flex-col min-h-screen">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-slate-900 text-white grid place-items-center text-base">🏥</div>
                    <div>
                        <h1 class="font-bold text-slate-900 leading-tight">Control BIM</h1>
                        <p class="text-xs text-slate-500">
                            <b id="user-display" class="text-sky-600"></b>
                            (<span id="role-display" class="font-semibold uppercase text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-700"></span>)
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-new-task" onclick="openModal()" class="hidden px-3.5 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition">
                        + Nuevo Contenedor
                    </button>
                    <button onclick="handleLogout()" class="px-3 py-2 text-xs border border-slate-300 rounded-lg hover:bg-slate-100 transition text-slate-600">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>

        <nav class="bg-white border-b border-slate-200 sticky top-16 z-20">
            <div class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto" id="tabs-nav">
                <button data-tab="mitrabajo" onclick="switchTab('mitrabajo')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap hidden">👤 Mi Trabajo</button>
                <button data-tab="dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">📊 Dashboard</button>
                <button data-tab="tabla" onclick="switchTab('tabla')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">📋 Base</button>
                <button data-tab="kanban" onclick="switchTab('kanban')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">🗂 Kanban</button>
                <button data-tab="eisenhower" onclick="switchTab('eisenhower')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">🎯 Eisenhower</button>
                <button data-tab="manpower" onclick="switchTab('manpower')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">⏱ MANPOWER</button>
                <button id="tab-config-btn" data-tab="config" onclick="switchTab('config')" class="tab-btn hidden px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">⚙️ Configuración</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-4">
            <!-- AQUI SE INYECTAN LAS VISTAS DINAMICAMENTE -->
            <div id="view-container"></div>
        </main>
    </div>

    <!-- MODAL TASK -->
    <div id="modal-task" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 space-y-3 max-h-[92vh] overflow-y-auto">
            <h3 class="font-bold text-sm text-slate-800" id="modal-title">Nuevo Contenedor</h3>
            <form onsubmit="saveTask(event)" class="space-y-3 text-xs">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Actividad *</label>
                    <input type="text" id="task-actividad" required class="inp">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Grupo</label>
                        <select id="task-grupo" class="inp"></select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Responsable</label>
                        <select id="task-responsable" class="inp"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Criticidad</label>
                        <select id="task-criticidad" class="inp">
                            <option>Muy alto</option><option>Alto</option><option>Medio</option><option>Bajo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Estado</label>
                        <select id="task-estado" class="inp">
                            <option>No iniciado</option><option>En proceso</option><option>En espera</option><option>Reprogramado</option><option>Cerrado</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Fecha fin prog.</label>
                        <input type="date" id="task-fecha-fin" class="inp">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Fecha cierre</label>
                        <input type="date" id="task-fecha-cierre" class="inp">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nota / restricción</label>
                    <textarea id="task-nota" rows="2" class="inp"></textarea>
                </div>

                <!-- PROPIEDADES PERSONALIZADAS -->
                <div id="custom-props-container" class="border-t border-slate-200 pt-3 mt-3 hidden">
                    <p class="text-[11px] font-bold text-slate-700 mb-2">Propiedades Personalizadas</p>
                    <div id="custom-props-inputs" class="space-y-2"></div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 border border-slate-300 rounded text-slate-600">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 bg-sky-600 text-white font-semibold rounded hover:bg-sky-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-4 py-2 rounded-lg z-50 shadow-lg"></div>

    <!-- SCRIPTS -->
    <script src="js/app.js" type="module"></script>
</body>
</html>
