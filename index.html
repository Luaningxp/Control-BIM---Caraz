<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Control BIM · Hospital Caraz II-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- AGREGA ESTA LÍNEA -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- FIN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">

        <!-- LOGIN -->
    <div id="login-screen" class="login-page">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logos">
                    <img src="assets/suyay.png" alt="SUYAY">
                    <div class="separator"></div>
                    <img src="assets/anin.png" alt="ANIN">
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Control BIM</h2>
                <p class="text-xs font-bold text-sky-600 uppercase tracking-widest mt-1">Consorcio SUYAY II</p>
                <p class="text-sm text-slate-500 mt-1 font-medium">Hospital Caraz II-1 · Paquete 8</p>
            </div>

            <div class="login-body">
                <div id="login-error" class="login-error"></div>
                
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1 uppercase tracking-wide">Correo Electrónico</label>
                        <input type="email" id="login-email" required 
                               class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" 
                               placeholder="usuario@consorciosuyay.com">
                    </div>
                    <div>
    <label class="block text-[11px] font-bold text-slate-600 mb-1 uppercase tracking-wide">Contraseña</label>
    <div class="relative">
        <input type="password" id="login-password" required 
               class="w-full border border-slate-300 rounded-lg px-3 py-2.5 pr-10 text-sm focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" 
               placeholder="••••••••">
        <!-- BOTÓN DEL OJITO -->
        <button type="button" onclick="togglePassword()" 
                class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition p-1">
            <i class="fa-solid fa-eye" id="eye-icon"></i>
        </button>
    </div>
</div>
                    <button type="submit" id="btn-login" 
                            class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-lg shadow-sky-600/30 flex justify-center items-center gap-2 mt-2">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar al CDE
                    </button>
                </form>
            </div>
                        <div class="bg-slate-50 p-3 text-center border-t border-slate-200 rounded-b-2xl">
                <p class="text-[10px] text-slate-400 font-semibold mb-1">© 2026 Consorcio SUYAY II · ANIN</p>
                <p class="text-[10px] text-slate-500 font-medium">
                    Desarrollado por <span class="text-sky-600 font-bold">Ing. Luis Romero</span> · <i class="fa-solid fa-phone text-[9px] ml-0.5"></i> 928283031
                </p>
            </div>
        </div>
    </div>

    <!-- APP (Oculta por defecto) -->
    <div id="app-screen" class="hidden flex-col min-h-screen">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-slate-900 text-white grid place-items-center text-base">🏥</div>
                    <div>
                        <h1 class="font-bold text-slate-900 leading-tight">Control BIM</h1>
                        <p class="text-xs text-slate-500">
                            <b id="user-display" class="text-sky-600"></b>
                            (<span id="role-display" class="font-semibold uppercase text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-700"></span>)
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
            <button id="btn-new-task" onclick="window.openModal()" class="hidden px-3.5 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition">
    + Nueva Actividad
</button>
                    <button id="btn-logout" class="px-3 py-2 text-xs border border-slate-300 rounded-lg hover:bg-slate-100 transition text-slate-600">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>

        <nav class="bg-white border-b border-slate-200 sticky top-16 z-20">
            <div class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto" id="tabs-nav">
                <button data-tab="mitrabajo" onclick="window.switchTab('mitrabajo')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap hidden">👤 Mi Trabajo</button>
                <button data-tab="dashboard" onclick="window.switchTab('dashboard')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">📊 Dashboard</button>
                <button data-tab="tabla" onclick="window.switchTab('tabla')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">📋 Gestión de Actividades</button>
                <button data-tab="kanban" onclick="window.switchTab('kanban')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">🗂 Kanban</button>
                <button data-tab="eisenhower" onclick="window.switchTab('eisenhower')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">🎯 Eisenhower</button>
                <button data-tab="manpower" onclick="window.switchTab('manpower')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">⏱ MANPOWER</button>
                <button data-tab="recursos" onclick="window.switchTab('recursos')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">📊 Recursos</button>
                <button id="tab-config-btn" data-tab="config" onclick="window.switchTab('config')" class="tab-btn hidden px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">⚙️ Configuración</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-4">
            <div id="view-container"></div>
        </main>
    </div>

               <!-- MODAL TASK -->
    <div id="modal-task" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 space-y-3 max-h-[92vh] overflow-y-auto">
            <h3 class="font-bold text-sm text-slate-800" id="modal-title">Nueva Actividad</h3>
            <form onsubmit="window.saveTask(event)" class="space-y-3 text-xs">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Actividad *</label>
                    <input type="text" id="task-actividad" required class="inp">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Grupo</label>
                        <select id="task-grupo" class="inp"></select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Responsable (Dueño)</label>
                        <select id="task-responsable" class="inp"></select>
                    </div>
                </div>

                <!-- RECURSOS (MODELADORES) -->
                <div class="relative">
                    <label class="block font-semibold text-slate-600 mb-1">Recursos (Modeladores)</label>
                    <div id="recursos-chips" class="flex flex-wrap gap-1.5 mb-1.5 min-h-[32px] p-1.5 border border-slate-300 rounded-lg bg-white"></div>
                    <div class="relative">
                        <input type="text" id="recursos-search" placeholder="Escribe para buscar modelador..." 
                               class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-sky-600">
                        <div id="recursos-dropdown" class="hidden absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-y-auto"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Importancia</label>
                        <select id="task-importancia" class="inp">
                            <option>Muy alto</option><option>Alto</option><option>Medio</option><option>Bajo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Urgencia</label>
                        <select id="task-urgencia" class="inp">
                            <option>Muy alto</option><option>Alto</option><option>Medio</option><option>Bajo</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Estado</label>
                        <select id="task-estado" class="inp">
                            <option>No iniciado</option><option>En proceso</option><option>En espera</option><option>Reprogramado</option><option>Cerrado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Cierre Real</label>
                        <input type="date" id="task-fecha-cierre" class="inp">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Inicio Prog.</label>
                        <input type="date" id="task-fecha-inicio" class="inp">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Fin Prog.</label>
                        <input type="date" id="task-fecha-fin" class="inp">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nota / restricción</label>
                    <textarea id="task-nota" rows="2" class="inp"></textarea>
                </div>

                <div id="custom-props-container" class="border-t border-slate-200 pt-3 mt-3 hidden">
                    <p class="text-[11px] font-bold text-slate-700 mb-2">Propiedades Personalizadas</p>
                    <div id="custom-props-inputs" class="space-y-2"></div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="window.closeModal()" class="px-3 py-1.5 border border-slate-300 rounded text-slate-600">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 bg-sky-600 text-white font-semibold rounded hover:bg-sky-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <!-- MODAL CDE -->
    <div id="modal-cde" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-5 space-y-3">
            <h3 class="font-bold text-sm text-slate-800" id="cde-title">Transición CDE · ISO 19650</h3>
            <p id="cde-current" class="text-[11px] text-slate-500"></p>
            <div class="space-y-2 text-xs">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Estado destino</label>
                    <select id="cde-estado" class="inp">
                        <option value="WIP">WIP</option><option value="Shared">Shared</option>
                        <option value="Published">Published</option><option value="Archived">Archived</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Aptitud</label>
                    <select id="cde-aptitud" class="inp">
                        <option value="">— No cambiar —</option>
                        <option value="S0">S0 · WIP</option><option value="S1">S1 · Coordinación</option>
                        <option value="S3">S3 · Revisión</option><option value="S4">S4 · Aprobación</option>
                        <option value="A1">A1 · Autorizado</option><option value="CR">CR · As-built</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Comentario (auditoría)</label>
                    <textarea id="cde-comentario" rows="2" class="inp" placeholder="Motivo de la transición..."></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" onclick="window.closeModalCDE()" class="px-3 py-1.5 border border-slate-300 rounded text-slate-600 text-xs">Cancelar</button>
                <button type="button" onclick="window.confirmarTransicion()" class="px-4 py-1.5 bg-teal-600 text-white font-semibold rounded hover:bg-teal-700 text-xs">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- MODAL HISTORIAL -->
    <div id="modal-hist" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 space-y-3 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm text-slate-800">Historial CDE</h3>
                <button onclick="document.getElementById('modal-hist').classList.add('hidden')" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="hist-content" class="space-y-2 text-xs"></div>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-4 py-2 rounded-lg z-50 shadow-lg"></div>

    <!-- SCRIPTS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
