<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Control BIM · Hospital Caraz II-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- LOGIN -->
    <div id="login-screen" class="login-page">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logos">
                    <img src="assets/suyay.png" alt="SUYAY">
                    <div class="separator"></div>
                    <img src="assets/anin.png" alt="ANIN">
                </div>
                <h2 class="text-lg font-bold text-slate-900">Control BIM</h2>
                <p class="text-[10px] font-bold text-sky-600 uppercase tracking-widest mt-1">Consorcio SUYAY II</p>
                <p class="text-[11px] text-slate-500 mt-0.5">Hospital Caraz II-1 · Paquete 8</p>
            </div>

            <div class="login-body">
                <div id="login-error" class="login-error"></div>
                
                <!-- FORMULARIO SIN onsubmit PARA QUE APP.JS LO CONTROLE -->
                <form id="login-form" class="space-y-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1 uppercase tracking-wide">Correo Electrónico</label>
                        <input type="email" id="login-email" required 
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" 
                               placeholder="usuario@consorciosuyay.com">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1 uppercase tracking-wide">Contraseña</label>
                        <input type="password" id="login-password" required 
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" 
                               placeholder="••••••••">
                    </div>
                    <button type="submit" id="btn-login" 
                            class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 rounded-lg text-sm transition shadow-md flex justify-center items-center gap-2 mt-2">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar
                    </button>
                </form>
            </div>
            <div class="bg-slate-50 p-2.5 text-center border-t border-slate-200 rounded-b-2xl">
                <p class="text-[9px] text-slate-400 font-medium">© 2026 Consorcio SUYAY II · ANIN</p>
            </div>
        </div>
    </div>

    <!-- APP (Oculta por defecto) -->
    <div id="app-screen" class="hidden flex-col min-h-screen">
        <!-- ... Todo el header y el main igual que antes ... -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-slate-900 text-white grid place-items-center text-base">🏥</div>
                    <div>
                        <h1 class="font-bold text-slate-900 leading-tight">Control BIM</h1>
                        <p class="text-xs text-slate-500">
                            <b id="user-display" class="text-sky-600"></b>
                            (<span id="role-display" class="font-semibold uppercase text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-700"></span>)
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-new-task" onclick="window.openModal()" class="hidden px-3.5 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm transition">+ Nuevo Contenedor</button>
                    <button id="btn-logout" class="px-3 py-2 text-xs border border-slate-300 rounded-lg hover:bg-slate-100 transition text-slate-600">Cerrar Sesión</button>
                </div>
            </div>
        </header>
        <nav class="bg-white border-b border-slate-200 sticky top-16 z-20">
            <div class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto" id="tabs-nav">
                <button data-tab="mitrabajo" onclick="window.switchTab('mitrabajo')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap hidden">👤 Mi Trabajo</button>
                <button data-tab="dashboard" onclick="window.switchTab('dashboard')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">📊 Dashboard</button>
                <button data-tab="tabla" onclick="window.switchTab('tabla')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">📋 Base</button>
                <button data-tab="kanban" onclick="window.switchTab('kanban')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">🗂 Kanban</button>
                <button data-tab="eisenhower" onclick="window.switchTab('eisenhower')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">🎯 Eisenhower</button>
                <button data-tab="manpower" onclick="window.switchTab('manpower')" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">⏱ MANPOWER</button>
                <button id="tab-config-btn" data-tab="config" onclick="window.switchTab('config')" class="tab-btn hidden px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 whitespace-nowrap">⚙️ Configuración</button>
            </div>
        </nav>
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-4">
            <div id="view-container"></div>
        </main>
    </div>

    <!-- MODALES Y TOAST (Iguales a tu archivo) -->
    <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-4 py-2 rounded-lg z-50 shadow-lg"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
